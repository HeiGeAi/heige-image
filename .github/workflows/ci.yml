name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - run: pip-audit -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/render.py templates/cover-clean.html --node "#cover" -o /tmp/heige-image-render.png --settle-ms 0
      - run: python -c 'from pathlib import Path; from scripts.image_output import validate_image_bytes; from scripts.render import _png_size; p=Path("/tmp/heige-image-render.png"); validate_image_bytes(p.read_bytes()); assert _png_size(p) == (2160, 2880)'
